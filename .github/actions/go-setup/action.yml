name: Go + libyara setup
description: >
  Set up Go 1.26 (with go.sum module cache) and install libyara-dev — the CGO
  dependency every build-based job needs. Optional extra apt packages via the
  `packages` input (e.g. clang for the ASan job). Factored out so lint/asan/
  codeql/fuzz share one definition instead of repeating setup-go + apt.

inputs:
  packages:
    description: Extra apt packages to install alongside libyara-dev.
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
      with:
        # Pin the exact patch, not the "1.26" line: a self-hosted runner caches
        # the toolchain and a minor-only version can match a stale cached patch
        # without fetching newer patches, so govulncheck flags stdlib CVEs
        # already fixed in a later patch.
        # For example, GO-2026-5856. Bump this on each stdlib-security patch.
        go-version: "1.26.8"
        cache-dependency-path: go.sum
    - name: install libyara (CGO dep) ${{ inputs.packages }}
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libyara-dev ${{ inputs.packages }}
