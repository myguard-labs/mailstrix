# strixd CI — the change-selected PR gate. Authoritative job is `docker` (self-contained
# libyara); `lint` + `scanners` run alongside. Deep/slow, low-per-PR-yield checks
# (asan, codeql, fuzz) run MONTHLY in maintenance.yml, NOT on every PR. Exposed
# via workflow_call so release.yml runs this same gate before publishing. Build
# with go 1.26 — older branches no longer get the stdlib security fixes
# govulncheck enforces.
name: ci
on:
  # CI runs on PRs into main/master ONLY — not on push to main. A merge already
  # passed this gate on the PR, so re-running it on the resulting push to main is
  # wasted compute. release.yml still invokes this same gate via workflow_call
  # before publishing.
  pull_request:
    # Per-item campaign PRs target the staging branch `dev` and are gated by the
    # local CI gate only (a superrepo-side wrapper); remote CI runs once on the
    # aggregate dev->main PR. Filtering on the base branch keeps PRs into dev from
    # firing this workflow while still running it for PRs into main/master.
    branches: [main, master]
  workflow_call:

# Cancel a superseded in-progress run when new commits land on the same PR/ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: [self-hosted, builder02, docker]
    timeout-minutes: 5
    outputs:
      go: ${{ steps.plan.outputs.go }}
      image: ${{ steps.plan.outputs.image }}
      parity: ${{ steps.plan.outputs.parity }}
      postfix: ${{ steps.plan.outputs.postfix }}
      rspamd: ${{ steps.plan.outputs.rspamd }}
      spamassassin: ${{ steps.plan.outputs.spamassassin }}
      python: ${{ steps.plan.outputs.python }}
      prometheus: ${{ steps.plan.outputs.prometheus }}
      dependencies: ${{ steps.plan.outputs.dependencies }}
      workflows: ${{ steps.plan.outputs.workflows }}
      shell: ${{ steps.plan.outputs.shell }}
      dockerfiles: ${{ steps.plan.outputs.dockerfiles }}
      scope: ${{ steps.plan.outputs.scope }}
      maintscript: ${{ steps.plan.outputs.maintscript }}
      generate: ${{ steps.plan.outputs.generate }}
      pins: ${{ steps.plan.outputs.pins }}
      qualification: ${{ steps.plan.outputs.qualification }}
      runners: ${{ steps.plan.outputs.runners }}
      ruleargs: ${{ steps.plan.outputs.ruleargs }}
      filter: ${{ steps.plan.outputs.filter }}
      envkeys: ${{ steps.plan.outputs.envkeys }}
      readme: ${{ steps.plan.outputs.readme }}
      links: ${{ steps.plan.outputs.links }}
      smoke: ${{ steps.plan.outputs.smoke }}
      benchmark: ${{ steps.plan.outputs.benchmark }}
      dockerignore: ${{ steps.plan.outputs.dockerignore }}
      docker: ${{ steps.plan.outputs.docker }}
      changed_files: ${{ steps.plan.outputs.changed_files }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # zizmor: ignore[artipacked]
        with:
          fetch-depth: 2
      - name: impact planner regression controls
        run: python3 -B -m unittest discover -s ci -p 'ci_*_test.py'
      - name: required check contract fixtures
        run: python3 -B ci/workflow_contract_test.py
      - name: plan affected CI domains
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: bash scripts/ci-plan.sh

  # Authoritative gate: build + test exactly as the production image does (CGO
  # against the statically-built libyara). The Dockerfile `test` target runs
  # `go vet` + `go test -race -tags yara_static`; then we build the final image,
  # run it against a local EICAR rule, and smoke the HTTP contract.
  docker:
    needs: changes
    # Keep the authoritative check reporting even when domains are unaffected.
    # A failed/cancelled planner must never turn into successful skipped checks.
    if: ${{ always() }}
    runs-on: [self-hosted, builder02, docker]
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write   # buildx GHA layer cache (--cache-to/from type=gha)
    steps:
      - name: require a successful impact plan
        env:
          PLAN_RESULT: ${{ needs.changes.result }}
        run: test "$PLAN_RESULT" = success
      - if: needs.changes.outputs.docker == 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # zizmor: ignore[artipacked]
        with:
          # The PR merge commit plus its first parent (the base tip), so the
          # test stage can diff exactly this PR's changes.
          fetch-depth: 2

      - if: needs.changes.outputs.docker == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - if: needs.changes.outputs.docker == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8
        with:
          script: |
            if (!process.env.ACTIONS_RUNTIME_TOKEN || !(process.env.ACTIONS_RESULTS_URL || process.env.ACTIONS_CACHE_URL)) {
              throw new Error("BuildKit cache runtime is unavailable");
            }
            core.setSecret(process.env.ACTIONS_RUNTIME_TOKEN);
            for (const name of ["ACTIONS_RUNTIME_TOKEN", "ACTIONS_RESULTS_URL", "ACTIONS_CACHE_URL", "ACTIONS_CACHE_SERVICE_V2"]) {
              if (process.env[name]) core.exportVariable(name, process.env[name]);
            }

      - name: build test stage (affected vet + race tests in-image)
        if: needs.changes.outputs.go == 'true' || needs.changes.outputs.postfix == 'true'
        env:
          CHANGED_FILES: ${{ needs.changes.outputs.changed_files }}
        run: |
          docker buildx build --target test -f docker/Dockerfile -t strixd-test \
            --load --build-arg CHANGED_FILES="$CHANGED_FILES" \
            --cache-from type=gha,scope=strixd-build \
            --cache-to type=gha,mode=max,scope=strixd-build .

      - name: build verifier and final images
        if: needs.changes.outputs.image == 'true'
        env:
          RULES_CACHEBUST: >-
            rules-${{ hashFiles(
              'docker/local-rules/**',
              'docker/fetch-rules.sh',
              'docker/compile-rules.sh',
              'docker/Dockerfile'
            ) }}
        run: |
          docker buildx bake -f docker/bake.ci.hcl \
            --set "final.args.CACHEBUST=$RULES_CACHEBUST" \
            ci-images

      - name: smoke isolated rules verifier
        if: needs.changes.outputs.image == 'true'
        run: |
          status=0
          docker run --rm --read-only --network none \
            --tmpfs /tmp:rw,nosuid,nodev,size=2g strixd-rules-verifier:ci \
            -url http://127.0.0.1:1 -allow-http -timeout 1s > verifier-smoke.log 2>&1 \
            || status=$?
          test "$status" -eq 2
          # Contract check: fetchRules wraps manifest transport errors with
          # this prefix.
          grep -F 'fetch manifest:' verifier-smoke.log

      - name: Postfix milter policy integration (isolated, harmless messages)
        if: needs.changes.outputs.postfix == 'true'
        run: |
          docker build -f contrib/postfix/Dockerfile.integration \
            -t mailstrix-postfix-test contrib/postfix
          timeout 90s docker run --rm --network none mailstrix-postfix-test

      - name: Trivy DB cache date
        if: needs.changes.outputs.image == 'true'
        id: trivy-date
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: cache Trivy DB
        if: needs.changes.outputs.image == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .trivy-cache
          key: trivy-0.62.1-${{ runner.os }}-${{ steps.trivy-date.outputs.day }}
          restore-keys: trivy-0.62.1-${{ runner.os }}-

      - name: trivy image scan (HIGH,CRITICAL)
        if: needs.changes.outputs.image == 'true'
        run: |
          mkdir -p .trivy-cache
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            --user "$(id -u):$(id -g)" \
            --group-add "$(stat -c %g /var/run/docker.sock)" \
            -v "$PWD/.trivy-cache:/trivy-cache" \
            aquasec/trivy:0.62.1 image \
            --cache-dir /trivy-cache \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            --timeout 5m \
            strixd:ci

      - name: smoke matrix (HTTP contract + every rule/extractor channel)
        if: needs.changes.outputs.image == 'true'
        run: scripts/smoke.sh strixd:ci

  parity-isolation:
    needs: changes
    permissions:
      contents: read
      actions: write  # isolated BuildKit cache export
    if: ${{ needs.changes.outputs.parity == 'true' }}
    runs-on: [self-hosted, builder02, docker]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # zizmor: ignore[artipacked]
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8
        with:
          script: |
            if (!process.env.ACTIONS_RUNTIME_TOKEN || !(process.env.ACTIONS_RESULTS_URL || process.env.ACTIONS_CACHE_URL)) {
              throw new Error("BuildKit cache runtime is unavailable");
            }
            core.setSecret(process.env.ACTIONS_RUNTIME_TOKEN);
            for (const name of ["ACTIONS_RUNTIME_TOKEN", "ACTIONS_RESULTS_URL", "ACTIONS_CACHE_URL", "ACTIONS_CACHE_SERVICE_V2"]) {
              if (process.env[name]) core.exportVariable(name, process.env[name]);
            }
      - name: qualify optional Mailstrix isolation with inert fixtures
        env:
          CI_PARITY_CACHE: "1"
        run: |
          bash scripts/qualify-parity-isolation.sh --cleanup-images \
            "$RUNNER_TEMP/parity-isolation"
      - name: retain failed isolation qualification logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: parity-isolation-failure
          path: |
            ${{ runner.temp }}/parity-isolation/parity-runtime.log
            ${{ runner.temp }}/parity-isolation/parity-probe-runtime.log
            ${{ runner.temp }}/parity-isolation/parity-qualification-bin.log
            ${{ runner.temp }}/parity-isolation/qualification.log
            ${{ runner.temp }}/parity-isolation/parity-runtime.id
            ${{ runner.temp }}/parity-isolation/parity-probe-runtime.id
            ${{ runner.temp }}/parity-isolation/image-cleanup.log
          retention-days: 7
          if-no-files-found: warn

  lint:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' || needs.changes.outputs.scope == 'true' }}
    runs-on: [self-hosted, builder02, docker]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # zizmor: ignore[artipacked]
      - uses: ./.github/actions/go-setup
      - name: Docker vet wiring contract
        run: python3 -B ci/vet_wiring_test.py
      # Analysis tools are pinned to exact versions: `@latest` let a compromised or
      # merely broken upstream release change what CI runs, with no diff and no
      # review — the same supply-chain hole as an unpinned action.
      #
      # Cache the compiled analysis-tool binaries in ~/go/bin so they aren't
      # recompiled from source every run (was the ~7-8 min lint bottleneck —
      # go-setup already caches modules + build, not these tool binaries). Hashing
      # this workflow makes every reviewed install-pin change miss the cache.
      - name: pinned analysis-tool versions
        id: toolvers
        run: |
          {
            echo "staticcheck=v0.7.0"
            echo "govulncheck=v1.6.0"
            echo "gosec=v2.27.1"
          } >> "$GITHUB_OUTPUT"
      - name: cache go analysis tools
        id: gotools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/go/bin
          key: gotools-${{ runner.os }}-go1.26-selfhosted-sc${{ steps.toolvers.outputs.staticcheck }}-gv${{ steps.toolvers.outputs.govulncheck }}-gs${{ steps.toolvers.outputs.gosec }}-${{ hashFiles('.github/workflows/ci.yml', '.github/actions/go-setup/action.yml') }}
      # Presence-guarded (not just cache-hit): a cache blob restored from a
      # different runner image can be incomplete, and the self-hosted runner
      # does not have ~/go/bin on PATH by default.
      - name: install analysis tools
        env:
          GOTOOLS_CACHE_HIT: ${{ steps.gotools.outputs.cache-hit }}
        run: |
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/go/bin:$PATH"
          if [ "$GOTOOLS_CACHE_HIT" != true ]; then
            rm -f "$HOME/go/bin/staticcheck" \
              "$HOME/go/bin/govulncheck" "$HOME/go/bin/gosec"
          fi
          [ -x "$HOME/go/bin/staticcheck" ] ||
            go install "honnef.co/go/tools/cmd/staticcheck@v0.7.0"
          [ -x "$HOME/go/bin/govulncheck" ] ||
            go install "golang.org/x/vuln/cmd/govulncheck@v1.6.0"
          [ -x "$HOME/go/bin/gosec" ] ||
            go install "github.com/securego/gosec/v2/cmd/gosec@v2.27.1"
      - name: changed-test-scope contract
        if: needs.changes.outputs.scope == 'true'
        run: bash ci/testscope_test.sh
      - name: affected Go analysis
        env:
          CHANGED_FILES: ${{ needs.changes.outputs.changed_files }}
        run: bash scripts/ci-go-checks.sh

  # Non-Go static analysis (workflows, shell, Dockerfile, dependency CVEs). Run
  # via pinned upstream images instead of marketplace actions to avoid pulling
  # extra third-party Actions into the supply chain.
  scanners:
    needs: changes
    runs-on: [self-hosted, builder02, docker]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # zizmor: ignore[artipacked]
      # Images pinned to explicit versions (not :latest/:stable) for reproducible,
      # drift-free scans. Bump deliberately.
      - name: actionlint (workflow syntax + embedded shell)
        if: needs.changes.outputs.workflows == 'true'
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - name: shellcheck (all tracked shell scripts)
        if: needs.changes.outputs.shell == 'true'
        run: |
          mapfile -d '' -t shell_scripts < <(
            git ls-files -z -- '*.sh' 'contrib/sieve/strix-scan-wrapper'
          )
          test "${#shell_scripts[@]}" -gt 0
          docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:v0.10.0 \
            "${shell_scripts[@]}"

      - name: deb maintainer-script behaviour (upgrade must not disable)
        if: needs.changes.outputs.maintscript == 'true'
        run: sh packaging/deb/maintscript_test.sh

      - name: parity helper behaviour (stdlib controls, no Docker)
        if: needs.changes.outputs.python == 'true'
        # Keep discovered tests hermetic: no Docker, network, external service,
        # scanner installation, image, or corpus dependency belongs in this step.
        run: |
          python3 -B -m unittest discover -s tools/parity \
            -p '*_test.py'

      - name: rules publication ordering and isolated verifier failure
        if: needs.changes.outputs.generate == 'true'
        run: bash docker/generate-rules_test.sh

      - name: Prometheus rule behaviour
        if: needs.changes.outputs.prometheus == 'true'
        run: |
          image='prom/prometheus:v3.14.0@sha256:'
          image+='5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44'
          image+='b4a115d97a2c7af3b1c21cbb0'
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD:/workspace" -w /workspace \
            "$image" \
            test rules \
            contrib/deploy/prometheus/mailstrix-alerts_test.yml

      - name: SHA-pinned actions consistent across workflows
        if: needs.changes.outputs.pins == 'true'
        run: |
          sh packaging/deb/workflow_pins_test.sh
          python3 -B packaging/deb/workflow_pins_controls_test.py

      - name: parity qualification failure artifacts stay bounded
        if: needs.changes.outputs.qualification == 'true'
        run: |
          python3 -B packaging/deb/parity_qualification_artifact_test.py
          python3 -B packaging/deb/parity_image_cleanup_test.py
          python3 -B -m unittest discover -s ci -p 'parity_cache_test.py'

      - name: self-hosted runners use disposable builder slots
        if: needs.changes.outputs.runners == 'true'
        run: sh packaging/deb/runner_isolation_test.sh

      - name: documented rule-source build-args reach the build
        if: needs.changes.outputs.ruleargs == 'true'
        run: sh packaging/deb/rule_source_args_test.sh

      - name: mail-profile rule filter stays conservative
        if: needs.changes.outputs.filter == 'true'
        run: sh packaging/deb/filter_rules_test.sh

      - name: deb env sample keys match the code
        if: needs.changes.outputs.envkeys == 'true'
        run: |
          sh packaging/deb/env_keys_test.sh
          sh packaging/deb/stop_timeout_test.sh
          sh ci/rules_polling_defaults_test.sh

      - name: README install has no stale pinned versions
        if: needs.changes.outputs.readme == 'true'
        run: sh packaging/deb/readme_install_test.sh

      - name: contrib README relative links resolve
        if: needs.changes.outputs.links == 'true'
        run: sh packaging/deb/contrib_links_test.sh

      - name: smoke matrix is a shared script invoked by ci.yml
        if: needs.changes.outputs.smoke == 'true'
        run: sh packaging/deb/smoke_shared_test.sh

      - name: maintenance benchmark matches the Docker test contract
        if: needs.changes.outputs.benchmark == 'true'
        run: sh packaging/deb/benchmark_command_test.sh

      - name: .dockerignore keeps secrets/logs/binaries out of the build context
        if: needs.changes.outputs.dockerignore == 'true'
        run: |
          sh packaging/deb/dockerignore_test.sh
          sh packaging/deb/dockerignore_collision_test.sh
      - name: hadolint (Dockerfile; .hadolint.yaml ignores)
        if: needs.changes.outputs.dockerfiles == 'true'
        run: docker run --rm -v "$PWD:/repo" -w /repo hadolint/hadolint:v2.12.0 hadolint docker/Dockerfile docker/Dockerfile.release
      - name: osv-scanner (go.mod/go.sum dependency CVEs)
        if: needs.changes.outputs.dependencies == 'true'
        # --no-call-analysis=go: the v1.9.2 image bundles Go 1.23.4, which
        # cannot run govulncheck call-analysis against this go1.26 module
        # (fails "requires go >= 1.26.0"). Dependency-presence scanning still
        # runs; the pinned-toolchain govulncheck job covers reachability.
        run: docker run --rm -v "$PWD:/src" -w /src ghcr.io/google/osv-scanner:v1.9.2 --no-call-analysis=go --lockfile=go.mod

      - name: zizmor (Actions supply-chain hardening)
        if: needs.changes.outputs.workflows == 'true'
        run: docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/woodruffw/zizmor:1.6.0 --format plain .github/workflows/

  rspamd:
    needs: changes
    if: needs.changes.outputs.rspamd == 'true'
    runs-on: [self-hosted, builder02, docker]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # zizmor: ignore[artipacked]
      - name: luacheck (Lua lint for rspamd plugin)
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.21 sh -ec '
            apk add --no-cache luarocks5.4 lua5.4-dev gcc musl-dev >/dev/null 2>&1
            luarocks-5.4 install luacheck >/dev/null 2>&1
            luacheck contrib/rspamd/
          '

      - name: lua plugin unit tests (dedup + effort + explainability contracts)
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.21 sh -ec '
            apk add --no-cache lua5.1 lua5.4 >/dev/null 2>&1
            lua5.4 contrib/rspamd/test/mailstrix_dedup_spec.lua
            lua5.4 contrib/rspamd/test/mailstrix_effort_spec.lua
            lua5.4 contrib/rspamd/test/mailstrix_explain_spec.lua
            lua5.4 contrib/rspamd/test/mailstrix_feed_routing_spec.lua
            lua5.4 contrib/rspamd/test/mailstrix_cape_policy_spec.lua
            lua5.1 contrib/rspamd/test/mailstrix_cape_policy_spec.lua
          '

      - name: Rspamd policy configtest and daemon startup
        # Moving upstream compatibility lane: trixie and its Rspamd packages
        # intentionally track Debian updates. The checked-in mock policy tests
        # above are the reproducible contract gate; the pinned production build
        # and delivery gates remain authoritative.
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src debian:trixie-slim sh -ec '
            apt-get update >/dev/null 2>&1
            apt-get install -y --no-install-recommends \
              rspamd python3 >/dev/null 2>&1
            python3 contrib/rspamd/test/cape_startup_test.py
          '


  spamassassin:
    needs: changes
    if: needs.changes.outputs.spamassassin == 'true'
    runs-on: [self-hosted, builder02, docker]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # zizmor: ignore[artipacked]
      - name: spamassassin plugin (perl -c + http/shellout unit tests)
        run: |
          docker run --rm -v "$PWD:/src" -w /src debian:trixie-slim sh -ec '
            apt-get update >/dev/null 2>&1
            apt-get install -y --no-install-recommends spamassassin libhttp-tiny-perl perl >/dev/null 2>&1
            # Syntax-check the plugin against the installed Mail::SpamAssassin.
            perl -I contrib/spamassassin -c contrib/spamassassin/Mailstrix.pm
            # Hermetic unit tests: http mode via a mocked HTTP::Tiny, shellout mode
            # via fake strix-scan scripts. No running strixd needed.
            prove -v -I contrib/spamassassin contrib/spamassassin/t/mailstrix.t
            d=/etc/spamassassin
            install -m644 contrib/spamassassin/Mailstrix.pm "$d/Mailstrix.pm"
            install -m644 contrib/spamassassin/mailstrix.pre "$d/mailstrix.pre"
            install -m644 contrib/spamassassin/mailstrix.cf "$d/mailstrix.cf"
            spamassassin --lint
          '


  # NOTE: asan, codeql, fuzz, semgrep, arm64-race are DEEP, slow, or
  # low-per-PR-yield checks — they run MONTHLY (+ on demand) in maintenance.yml,
  # NOT on every PR. The per-PR
  # gate (affected Docker, lint, scanners and integration domains) stays fast; release.yml reuses THIS workflow
  # (workflow_call) so a tagged release re-runs docker+lint+scanners before
  # publishing. asan/codeql/fuzz run on the monthly cadence, not per release.

  # Stable required check across selectively scheduled jobs. A planner failure,
  # failed gate, or unexpected skip must not look like a successful narrow run.
  ci-ok:
    if: ${{ always() }}
    needs: [changes, docker, parity-isolation, lint, scanners, rspamd, spamassassin]
    runs-on: [self-hosted, builder02, docker]
    timeout-minutes: 5
    steps:
      - name: require selected gates
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          SCANNERS_RESULT: ${{ needs.scanners.result }}
          PARITY_RESULT: ${{ needs.parity-isolation.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          RSPAMD_RESULT: ${{ needs.rspamd.result }}
          SPAMASSASSIN_RESULT: ${{ needs.spamassassin.result }}
          PARITY_SELECTED: ${{ needs.changes.outputs.parity }}
          GO_SELECTED: ${{ needs.changes.outputs.go }}
          SCOPE_SELECTED: ${{ needs.changes.outputs.scope }}
          RSPAMD_SELECTED: ${{ needs.changes.outputs.rspamd }}
          SPAMASSASSIN_SELECTED: ${{ needs.changes.outputs.spamassassin }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$DOCKER_RESULT" = success
          test "$SCANNERS_RESULT" = success
          require_selected() {
            case "$1" in
              true) test "$2" = success ;;
              false) test "$2" = skipped ;;
              *) return 1 ;;
            esac
          }
          require_selected "$PARITY_SELECTED" "$PARITY_RESULT"
          case "$GO_SELECTED:$SCOPE_SELECTED" in
            true:true|true:false|false:true) lint_selected=true ;;
            false:false) lint_selected=false ;;
            *) exit 1 ;;
          esac
          require_selected "$lint_selected" "$LINT_RESULT"
          require_selected "$RSPAMD_SELECTED" "$RSPAMD_RESULT"
