---
# Canary for the shared disposable builder-slot contract. Each serial pair
# uses the singleton selector for one physical slot, avoiding cross-host false
# passes.
name: runner isolation
"on":
  pull_request:
    paths:
      - '.github/runner/**'
      - '.github/workflows/**'
      - 'packaging/deb/runner_isolation_test.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  leave-lxc-state:
    runs-on:
      - self-hosted
      - b02lxc
      - lxc
    timeout-minutes: 5
    steps:
      # yamllint disable rule:line-length
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # zizmor: ignore[artipacked]
      # yamllint enable rule:line-length
      - name: leave host state outside the work directory
        shell: bash
        run: .github/runner/isolation-canary.sh leave lxc

  prove-lxc-restore:
    needs: leave-lxc-state
    runs-on:
      - self-hosted
      - b02lxc
      - lxc
    timeout-minutes: 5
    steps:
      # yamllint disable rule:line-length
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # zizmor: ignore[artipacked]
      # yamllint enable rule:line-length
      - name: prove pristine restore
        shell: bash
        run: .github/runner/isolation-canary.sh prove lxc

  leave-docker-state:
    runs-on:
      - self-hosted
      - builder02
      - docker
    timeout-minutes: 5
    steps:
      # yamllint disable rule:line-length
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # zizmor: ignore[artipacked]
      # yamllint enable rule:line-length
      - name: leave host state outside the work directory
        shell: bash
        run: .github/runner/isolation-canary.sh leave docker

  prove-docker-restore:
    needs: leave-docker-state
    runs-on:
      - self-hosted
      - builder02
      - docker
    timeout-minutes: 5
    steps:
      # yamllint disable rule:line-length
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # zizmor: ignore[artipacked]
      # yamllint enable rule:line-length
      - name: prove pristine restore
        shell: bash
        run: .github/runner/isolation-canary.sh prove docker
