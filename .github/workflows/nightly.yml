# Build fresh nightly binaries from main only when its commit has changed.
name: nightly
on:
  schedule:
    - cron: "0 9 * * *"  # 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: [self-hosted, builder02, docker]
    timeout-minutes: 10
    outputs:
      skip: ${{ steps.release.outputs.skip }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: ensure gh CLI
        run: |
          # Bounded retry: a brief mirror/proxy outage must not fail the job.
          command -v gh >/dev/null || {
            for attempt in 1 2 3 4; do
              sudo apt-get -o Acquire::Retries=3 update \
                && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gh \
                && break
              if [ "$attempt" -eq 4 ]; then
                echo "ensure gh CLI: giving up after $attempt attempts" >&2
                exit 1
              fi
              sleep $((attempt * 5))
            done
          }
      - name: compare nightly target with main
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "nightly requires the main branch" >&2
            exit 1
          fi
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "nightly requires a main commit SHA" >&2
            exit 1
          fi
          if target=$(gh release view nightly --repo "$GITHUB_REPOSITORY" \
            --json targetCommitish --jq '.targetCommitish' 2>&1); then
            :
          elif [[ "$target" == "release not found" ]]; then
            target=""
          else
            printf '%s\n' "$target" >&2
            exit 1
          fi
          if [[ "$target" == "$GITHUB_SHA" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=nightly-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

  gate:
    needs: plan
    if: needs.plan.outputs.skip == 'false'
    permissions:
      contents: read
      actions: write  # ci.yml's docker job uses the buildx GHA cache
    uses: ./.github/workflows/ci.yml

  binaries:
    needs: [plan, gate]
    if: needs.plan.outputs.skip == 'false' && needs.gate.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/build-binaries.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      arches: '["amd64"]'

  # Prove Dockerfile.release turns these exact nightly binaries and marker
  # toolchain into an image whose strixd loads the marker artifact, before the
  # assets are published. Same proof as release.yml's marker-image job.
  marker-image:
    needs: [plan, binaries]
    if: needs.binaries.result == 'success'
    runs-on: [self-hosted, builder02, docker]
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # zizmor: ignore[artipacked]

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: download amd64 binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: bin-amd64
          path: out/

      - name: nightly image loads markers (amd64)
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          MAILSTRIX_RELEASE_MARKER_RUN="nightly-${RUN_ID}-amd64" \
            bash ci/release_marker_image_test.sh amd64 out

  publish:
    needs: [plan, gate, binaries, marker-image]
    if: needs.binaries.result == 'success' && needs.marker-image.result == 'success'
    runs-on: [self-hosted, builder02, lxc]
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: download amd64 binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bin-amd64
          path: out/

      - name: checksums
        run: |
          set -euo pipefail
          cd out
          sha256sum strixd-linux-amd64 strix-scan-linux-amd64 \
            strix-milter-linux-amd64 yarac-linux-amd64 \
            libyara-linux-amd64.a > SHA256SUMS
          sha256sum -c SHA256SUMS

      # The self-hosted lxc runner image does not ship the gh CLI.
      - name: ensure gh CLI
        run: |
          # Bounded retry: a brief mirror/proxy outage must not fail the job.
          command -v gh >/dev/null || {
            for attempt in 1 2 3 4; do
              sudo apt-get -o Acquire::Retries=3 update \
                && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gh \
                && break
              if [ "$attempt" -eq 4 ]; then
                echo "ensure gh CLI: giving up after $attempt attempts" >&2
                exit 1
              fi
              sleep $((attempt * 5))
            done
          }

      - name: publish rolling nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(
            out/strixd-linux-amd64
            out/strix-scan-linux-amd64
            out/strix-milter-linux-amd64
            out/yarac-linux-amd64
            out/libyara-linux-amd64.a
            out/SHA256SUMS
          )
          # target_commitish is ignored for an existing tag. Remove the old
          # release and tag so the replacement records this exact main SHA.
          if current=$(gh release view nightly \
            --repo "$GITHUB_REPOSITORY" 2>&1); then
            gh release delete nightly --repo "$GITHUB_REPOSITORY" \
              --cleanup-tag --yes
          elif [[ "$current" != "release not found" ]]; then
            printf '%s\n' "$current" >&2
            exit 1
          fi
          gh release create nightly --repo "$GITHUB_REPOSITORY" \
            --title "Nightly" \
            --notes "Nightly build of ${GITHUB_SHA}" \
            --target "$GITHUB_SHA" \
            --prerelease --latest=false \
            "${assets[@]}"
