# Build fresh amd64 + arm64 nightly binaries from main, but only when what ships
# (the Go sources and docker/ build inputs, tests excluded) changed since the
# commit the current rolling `nightly` release was built from. The published
# release is replaced, never appended to. The binaries are built and proven
# natively on GitHub-hosted runners of each architecture. dockerized's 12:00 UTC daily builds
# mailstrix:testing from this release, so it runs two hours earlier.
name: nightly
on:
  schedule:
    - cron: "0 10 * * *"  # 10:00 UTC, before the 12:00 UTC dockerized daily
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when no shipped input changed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      skip: ${{ steps.release.outputs.skip }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: compare nightly target with main
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "nightly requires the main branch" >&2
            exit 1
          fi
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "nightly requires a main commit SHA" >&2
            exit 1
          fi
          if target=$(gh release view nightly --repo "$GITHUB_REPOSITORY" \
            --json targetCommitish --jq '.targetCommitish' 2>&1); then
            :
          elif [[ "$target" == "release not found" ]]; then
            target=""
          else
            printf '%s\n' "$target" >&2
            exit 1
          fi
          # Inputs that change the shipped binaries or the Dockerfile.release
          # image; tests and their fixtures do not.
          shipped=(cmd internal third_party go.mod go.sum docker NOTICE .dockerignore
            ':(exclude,glob)**/*_test.go' ':(exclude,glob)**/testdata/**'
            ':(exclude,glob)docker/**/*_test.sh'
            ':(exclude,glob)docker/**/*.md')
          if [[ "$target" == "$GITHUB_SHA" && "$FORCE" != true ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "$target" && "$FORCE" != true ]] \
            && git cat-file -e "${target}^{commit}" 2>/dev/null \
            && git diff --quiet "$target" "$GITHUB_SHA" -- "${shipped[@]}"; then
            # An unknown target or a failed diff falls through to a build.
            echo "no shipped input changed since nightly ${target}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=nightly-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

  gate:
    needs: plan
    if: needs.plan.outputs.skip == 'false'
    permissions:
      contents: read
      actions: write  # ci.yml's docker job uses the buildx GHA cache
    uses: ./.github/workflows/ci.yml

  # Builds alongside the gate instead of after it; publish waits for both.
  binaries:
    needs: plan
    if: needs.plan.outputs.skip == 'false'
    permissions:
      contents: read
      actions: write  # buildx GHA layer cache
    uses: ./.github/workflows/build-binaries.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      arches: '["amd64","arm64"]'
      gha-cache: true

  # Prove Dockerfile.release turns these exact nightly binaries and marker
  # toolchain into an image whose strixd loads the marker artifact, before the
  # assets are published. Same proof as release.yml's marker-image job, native
  # per arch on GitHub-hosted runners (no QEMU).
  marker-image:
    needs: [plan, binaries]
    if: needs.binaries.result == 'success'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # zizmor: ignore[artipacked]

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: download arch binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: bin-${{ matrix.arch }}
          path: out/

      - name: nightly image loads markers (${{ matrix.arch }})
        env:
          ARCH: ${{ matrix.arch }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          MAILSTRIX_RELEASE_MARKER_RUN="nightly-${RUN_ID}-${ARCH}" \
            bash ci/release_marker_image_test.sh "${ARCH}" out

  publish:
    needs: [plan, gate, binaries, marker-image]
    if: >-
      needs.gate.result == 'success' && needs.binaries.result == 'success'
      && needs.marker-image.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: download arch binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: bin-*
          merge-multiple: true
          path: out/

      - name: checksums
        run: |
          set -euo pipefail
          cd out
          set --
          for arch in amd64 arm64; do
            set -- "$@" "strixd-linux-${arch}" "strix-scan-linux-${arch}" \
              "strix-milter-linux-${arch}" "yarac-linux-${arch}" \
              "libyara-linux-${arch}.a"
          done
          sha256sum "$@" > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: publish rolling nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set -- out/SHA256SUMS
          for arch in amd64 arm64; do
            set -- "$@" "out/strixd-linux-${arch}" "out/strix-scan-linux-${arch}" \
              "out/strix-milter-linux-${arch}" "out/yarac-linux-${arch}" \
              "out/libyara-linux-${arch}.a"
          done
          # target_commitish is ignored for an existing tag. Remove the old
          # release and tag so the replacement records this exact main SHA.
          if current=$(gh release view nightly \
            --repo "$GITHUB_REPOSITORY" 2>&1); then
            gh release delete nightly --repo "$GITHUB_REPOSITORY" \
              --cleanup-tag --yes
          elif [[ "$current" != "release not found" ]]; then
            printf '%s\n' "$current" >&2
            exit 1
          fi
          gh release create nightly --repo "$GITHUB_REPOSITORY" \
            --title "Nightly" \
            --notes "Nightly build of ${GITHUB_SHA}" \
            --target "$GITHUB_SHA" \
            --prerelease --latest=false \
            "$@"
