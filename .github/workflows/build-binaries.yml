# Build the release binaries for each requested architecture. The caller's
# workflow run receives the bin-<arch> artifacts for packaging or publication.
name: build binaries
on:
  workflow_call:
    inputs:
      version:
        description: Version passed to the Docker binary build
        required: true
        type: string
      arches:
        description: JSON array of target architectures
        required: false
        type: string
        default: '["amd64","arm64"]'
      gha-cache:
        description: >-
          Reuse and refresh the buildx layer cache in the GitHub Actions cache
          (the caller grants actions: write). Tag releases build uncached.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  binaries:
    # One GitHub-hosted runner per arch, each building natively (no QEMU; the
    # same pinned images give the same bytes as emulation).
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arches) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # zizmor: ignore[artipacked]

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      # BuildKit's type=gha cache needs the job's cache runtime in the step env.
      - name: expose buildx cache runtime
        if: inputs.gha-cache
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8
        with:
          script: |
            if (!process.env.ACTIONS_RUNTIME_TOKEN || !(process.env.ACTIONS_RESULTS_URL || process.env.ACTIONS_CACHE_URL)) {
              throw new Error("BuildKit cache runtime is unavailable");
            }
            core.setSecret(process.env.ACTIONS_RUNTIME_TOKEN);
            for (const name of ["ACTIONS_RUNTIME_TOKEN", "ACTIONS_RESULTS_URL", "ACTIONS_CACHE_URL", "ACTIONS_CACHE_SERVICE_V2"]) {
              if (process.env[name]) core.exportVariable(name, process.env[name]);
            }

      - name: build binaries (${{ matrix.arch }})
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
          GHA_CACHE: ${{ inputs.gha-cache }}
        run: |
          set -euo pipefail
          # ARCH is supplied by this step's env from the matrix.
          # shellcheck disable=SC2153
          arch="${ARCH}"
          cache=()
          if [[ "${GHA_CACHE}" == true ]]; then
            cache=(--cache-from "type=gha,scope=bin-${arch}"
              --cache-to "type=gha,mode=max,scope=bin-${arch}")
          fi
          docker buildx build \
            --target bin \
            "${cache[@]}" \
            --platform "linux/${arch}" \
            --build-arg "VERSION=${VERSION}" \
            --output "type=local,dest=dist/${arch}" \
            -f docker/Dockerfile .
          install -D "dist/${arch}/strixd" "out/strixd-linux-${arch}"
          # strix-scan: the lean, CGO-free Sieve/LDA client.
          install -D "dist/${arch}/strix-scan" "out/strix-scan-linux-${arch}"
          # strix-milter: the lean, CGO-free Postfix/Sendmail milter.
          install -D "dist/${arch}/strix-milter" "out/strix-milter-linux-${arch}"
          # The exact marker toolchain linked into strixd; Dockerfile.release
          # needs these bytes to bake a marker artifact strixd will load.
          install -D "dist/${arch}/yarac" "out/yarac-linux-${arch}"
          install -D -m 0644 "dist/${arch}/libyara.a" "out/libyara-linux-${arch}.a"
          ls -l out

      - name: upload arch binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: bin-${{ matrix.arch }}
          path: out/
          retention-days: 1
          if-no-files-found: error
