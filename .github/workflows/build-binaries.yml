# Build the release binaries for each requested architecture. The caller's
# workflow run receives the bin-<arch> artifacts for packaging or publication.
name: build binaries
on:
  workflow_call:
    inputs:
      version:
        description: Version passed to the Docker binary build
        required: true
        type: string
      arches:
        description: JSON array of target architectures
        required: false
        type: string
        default: '["amd64","arm64"]'

permissions:
  contents: read

jobs:
  binaries:
    # One runner per arch, each building natively: arm64 on GitHub's hosted arm
    # runner (no QEMU; the same pinned images give the same bytes as emulation).
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || fromJSON('["self-hosted","builder02","docker"]') }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arches) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # zizmor: ignore[artipacked]

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: build binaries (${{ matrix.arch }})
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          # ARCH is supplied by this step's env from the matrix.
          # shellcheck disable=SC2153
          arch="${ARCH}"
          docker buildx build \
            --target bin \
            --platform "linux/${arch}" \
            --build-arg "VERSION=${VERSION}" \
            --output "type=local,dest=dist/${arch}" \
            -f docker/Dockerfile .
          install -D "dist/${arch}/strixd" "out/strixd-linux-${arch}"
          # strix-scan: the lean, CGO-free Sieve/LDA client.
          install -D "dist/${arch}/strix-scan" "out/strix-scan-linux-${arch}"
          # strix-milter: the lean, CGO-free Postfix/Sendmail milter.
          install -D "dist/${arch}/strix-milter" "out/strix-milter-linux-${arch}"
          # The exact marker toolchain linked into strixd; Dockerfile.release
          # needs these bytes to bake a marker artifact strixd will load.
          install -D "dist/${arch}/yarac" "out/yarac-linux-${arch}"
          install -D -m 0644 "dist/${arch}/libyara.a" "out/libyara-linux-${arch}.a"
          ls -l out

      - name: upload arch binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: bin-${{ matrix.arch }}
          path: out/
          retention-days: 1
          if-no-files-found: error
