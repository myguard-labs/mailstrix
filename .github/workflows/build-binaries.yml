# Build the release binaries for each requested architecture. The caller's
# workflow run receives the bin-<arch> artifacts for packaging or publication.
name: build binaries
on:
  workflow_call:
    inputs:
      version:
        description: Version passed to the Docker binary build
        required: true
        type: string
      arches:
        description: JSON array of target architectures
        required: false
        type: string
        default: '["amd64","arm64"]'

permissions:
  contents: read

jobs:
  binaries:
    # One runner per arch so the slow arm64 QEMU build runs in parallel.
    runs-on: [self-hosted, builder02, docker]
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arches) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # zizmor: ignore[artipacked]

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3 arm64 emulation
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: build binaries (${{ matrix.arch }})
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          # ARCH is supplied by this step's env from the matrix.
          # shellcheck disable=SC2153
          arch="${ARCH}"
          docker buildx build \
            --target bin \
            --platform "linux/${arch}" \
            --build-arg "VERSION=${VERSION}" \
            --output "type=local,dest=dist/${arch}" \
            -f docker/Dockerfile .
          install -D "dist/${arch}/strixd" "out/strixd-linux-${arch}"
          # strix-scan: the lean, CGO-free Sieve/LDA client.
          install -D "dist/${arch}/strix-scan" "out/strix-scan-linux-${arch}"
          # strix-milter: the lean, CGO-free Postfix/Sendmail milter.
          install -D "dist/${arch}/strix-milter" "out/strix-milter-linux-${arch}"
          ls -l out

      - name: upload arch binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: bin-${{ matrix.arch }}
          path: out/
          retention-days: 1
          if-no-files-found: error
