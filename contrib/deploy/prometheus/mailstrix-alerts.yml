# Prometheus alerting rules for strixd. Load via rule_files: in prometheus.yml.
# Metric names match strixd's /metrics exposition (see internal/strixd/server.go).
# Scrape config (add to prometheus.yml):
#   - job_name: strixd
#     static_configs: [{ targets: ['strixd:8079'] }]
#   (set MAILSTRIX_METRICS_AUTH=0, or add authorization: with the token.)
groups:
  - name: strixd
    rules:
      # --- availability ---
      - alert: MailstrixDown
        expr: up{job="strixd"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "strixd target {{ $labels.instance }} is down"
          description: "Prometheus cannot scrape strixd for >2m. Mail malware scanning is offline."

      - alert: MailstrixNoRulesLoaded
        expr: mailstrix_rules == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "strixd has zero rules loaded"
          description: "mailstrix_rules=0 — the daemon is up but scanning nothing. Rule load/compile failed."

      # --- rule freshness (catches a silently-broken daily rebuild) ---
      - alert: MailstrixRulesNeverChecked
        expr: |
          mailstrix_rules_update_enabled == 1
            and mailstrix_rules_last_success_timestamp_seconds == 0
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "No successful automatic rules check"
          description: >-
            Polling is enabled but no release check has succeeded since startup.
            Check connectivity and manifest validation.

      # Allow the daily polling default plus up to 20% jitter (28.8 hours).
      # Adjust this 30-hour deadline for deployments with longer intervals.
      - alert: MailstrixRulesCheckOverdue
        expr: |
          mailstrix_rules_update_enabled == 1
            and mailstrix_rules_last_success_timestamp_seconds > 0
            and time() - mailstrix_rules_last_success_timestamp_seconds > 108000
        for: 0m
        labels: {severity: warning}
        annotations:
          summary: "Automatic rules checks are overdue"
          description: >-
            No successful release check has completed within the configured
            30-hour alert deadline. Check connectivity and update failures.

      - alert: MailstrixRulesPublishedNotLoaded
        expr: |
          mailstrix_rules_published_version != mailstrix_rules_loaded_version
            and mailstrix_rules_update_enabled == 1
            and mailstrix_rules_published_version > 0
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Published rules are not loaded"
          description: >-
            Published and loaded versions differ beyond the 30-minute SLA.
            Inspect update errors and libyara compatibility.

      - alert: MailstrixAutomaticReloadFailing
        expr: increase(mailstrix_rules_update_reload_failures_total[1h]) >= 3
        for: 0m
        labels: {severity: warning}
        annotations:
          summary: "Automatic rule reload repeatedly failed"
          description: >-
            At least three update reloads failed in one hour;
            the prior active rules remain in use.

      - alert: MailstrixRulesStale
        expr: mailstrix_rules_stale == 1
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "strixd ruleset is stale"
          description: "Loaded ruleset age exceeds MAILSTRIX_RULES_MAX_AGE. The daily fetch/rebuild likely stopped updating."

      - alert: MailstrixReloadFailing
        expr: increase(mailstrix_reload_failure_total[1h]) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "strixd rule reload failed"
          description: "A SIGHUP/boot reload failed to compile in the last hour; the previous rule set is kept."

      # --- health of the scan path ---
      - alert: MailstrixHighScanErrorRate
        expr: |
          sum(rate(mailstrix_errors_total[5m]))
            / clamp_min(sum(rate(mailstrix_scans_total[5m])), 0.001) > 0.05
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "strixd scan error rate >5%"
          description: "Over 5% of /scan requests are erroring (scan/read/length). Check libyara timeouts and rule health."

      - alert: MailstrixRawScanErrors
        expr: increase(mailstrix_raw_scan_errs_total[10m]) > 0
        for: 0m
        labels: { severity: info }
        annotations:
          summary: "strixd raw scans falling through to extraction"
          description: "Raw libyara scans are timing out/erroring and falling back to extraction — possible rule/perf regression."

      # --- backpressure / capacity ---
      - alert: MailstrixHighBusyRate
        expr: |
          sum(rate(mailstrix_busy_total[5m]))
            / clamp_min(sum(rate(mailstrix_scans_total[5m]) + rate(mailstrix_busy_total[5m])), 0.001) > 0.10
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "strixd rejecting >10% of requests (concurrency gate)"
          description: "The admission gate is shedding load. Raise MAILSTRIX_MAX_INFLIGHT, scale out, or lower effort."

      # --- feed freshness (only meaningful when the feed is enabled) ---
      - alert: MailstrixFeedRefreshFailing
        expr: |
          increase(mailstrix_urlhaus_refresh_failures_total[2h]) > 0
            or increase(mailstrix_malwarebazaar_refresh_failures_total[2h]) > 0
        for: 0m
        labels: { severity: info }
        annotations:
          summary: "strixd abuse.ch feed refresh failing"
          description: "An enabled abuse.ch feed (URLhaus/MalwareBazaar/…) has failed to refresh for 2h; lookups use stale data (fail-open)."

      # --- ICAP (only meaningful when MAILSTRIX_ICAP_ADDR is set; counters stay 0 otherwise) ---
      - alert: MailstrixICAPHighInfectionRate
        expr: |
          sum(rate(mailstrix_icap_infected_total[15m]))
            / clamp_min(sum(rate(mailstrix_icap_requests_total[15m])), 0.001) > 0.20
        for: 15m
        labels: { severity: info }
        annotations:
          summary: "strixd ICAP infection rate >20%"
          description: "Over 20% of ICAP REQMOD/RESPMOD requests matched a rule (403 sent) for 15m. Expected during an outbreak; otherwise check for a noisy/false-positive rule."

      # --- container memory pressure (requires a known positive limit) ---
      - alert: MailstrixHighRSS
        expr: |
          mailstrix_rss_bytes > 0.75 * mailstrix_cgroup_mem_limit_bytes
            and mailstrix_cgroup_mem_limit_bytes > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "strixd RSS exceeds 75% of the container memory limit"
          description: >-
            RSS has exceeded 75% of the verified container memory limit for 5m.
            Investigate memory use, reduce in-flight/body limits, or raise the
            verified container limit.

      # Current and previous main/big/marker objects can normally total six.
      # This conservative ceiling can miss leaks below seven when optional sets
      # are disabled; the metric counts native objects, not bundle generations.
      - alert: MailstrixExcessRuleObjects
        expr: mailstrix_rule_generations > 6
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "strixd retains more than six native rule objects"
          description: >-
            More than six distinct native rule objects have remained live for
            10m. Investigate reload cadence, in-flight scans, and delayed
            GC/native memory reclamation; this is not proof of a leak.

      # Advisory 64 MiB budget is an actual histogram boundary, between 16 and
      # 256 MiB. A 5m rate window smooths bursts; 10m dwell avoids brief spikes.
      # No sum: histogram_quantile removes only le, retaining all target labels.
      # Round to whole bytes to avoid float noise at the exact budget boundary.
      # Linear interpolation within wide buckets estimates p99, not exact sizes;
      # +Inf observations cap the estimate at 256 MiB. Sparse traffic is noisy,
      # while absent/no observations yield no alert. Includes zero/error
      # results.
      - alert: MailstrixHighExtractionRetainedBytes
        expr: |
          round(histogram_quantile(0.99,
            rate(mailstrix_extraction_bytes_retained_bucket[5m]))) > 67108864
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "strixd extraction retained-byte p99 exceeds 64 MiB"
          description: >-
            Estimated p99 logical stream bytes per extraction has exceeded the
            advisory 64 MiB budget for 10m over a 5m rate window. Inspect
            large/archive inputs and extraction workload; reduce admitted body
            size or concurrency, or adjust this deployment budget. This is not
            allocated memory or an enforced extraction limit; bucket
            interpolation
            and sparse traffic limit precision.
