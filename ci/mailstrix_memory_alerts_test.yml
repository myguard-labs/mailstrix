      - series: >-
          mailstrix_extraction_bytes_retained_bucket{instance="i",job="strixd",deployment="a",le="+Inf"}
        values: >-
          0 100 200 300 400 500 600 700 800 900 1000 1100 1200 1300 1400 1500
          1600 1700 1800 1900 2000 2100 2200 2300 2400 2500
    alert_rule_test:
      - eval_time: 10m
        alertname: MailstrixHighExtractionRetainedBytes
        exp_alerts: []
      - eval_time: 11m
        alertname: MailstrixHighExtractionRetainedBytes
        exp_alerts:
          - exp_labels:
              instance: i
              job: strixd
              deployment: a
              severity: warning
            exp_annotations:
              summary: strixd extraction retained-byte p99 exceeds 64 MiB
              description: >-
                Estimated p99 logical stream bytes per extraction has exceeded
                the advisory 64 MiB budget for 10m over a 5m rate window.
                Inspect large/archive inputs and extraction workload; reduce
                admitted body size or concurrency, or adjust this deployment
                budget. This is not allocated memory or an enforced extraction
                limit; bucket interpolation and sparse traffic limit precision.
      - eval_time: 15m
        alertname: MailstrixHighExtractionRetainedBytes
        exp_alerts:
          - exp_labels:
              instance: i
              job: strixd
              deployment: a
