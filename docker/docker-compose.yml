# Reference compose for strixd. In the mailscreen stack this service is added to
# /opt/docker/mailscreen/docker-compose.yml with a static IPv4 on the shared
# internal network (rspamd's RBL-only resolver can't resolve docker names, so
# the mailstrix.lua plugin targets the IPv4 directly).
services:
  strixd:
    image: eilandert/mailstrix:latest
    container_name: strixd
    restart: unless-stopped
    # ~74 MB image + rules RSS (~90-200 MiB under macro/zip load, recorded
    # 2026-06-17) + in-flight request buffers (max_inflight × max_body). 512m
    # gives burst/GC headroom; 256m was tight (measured ~198 MiB peak, recorded
    # 2026-06-17). Lower max_inflight/max_body or set an explicit
    # MAILSTRIX_MAX_CONCURRENT if you must run leaner.
    # NOTE: the MalwareBazaar full feed is commented out below because its
    # refresh peak exceeds this limit. Measured 2026-10-15 (local 33-file rule
    # set, single samples, not a monotone series): VmHWM 2002876 kB (~1.9 GiB)
    # with all three feeds, 177860 kB with URLhaus+ThreatFox only, 341572 kB
    # with all feeds disabled.
    # The peak is the MalwareBazaar dump fetch/unzip (~225 MB dump; resident set
    # 64.6 MB, 1.15M hashes). A refresh-spike fix (P32) is in progress and not
    # merged. Re-measure before re-enabling MalwareBazaar at 512m.
    mem_limit: 512m
    # Optional, not set by default: GOMEMLIMIT = mem_limit - measured libyara (C)
    # RSS. Example value only (120 MiB, not measured, recorded 2026-10-15): 392MiB
    # for 512m. To set it, add GOMEMLIMIT to the environment: map below. See the
    # README "Go memory limit (GOMEMLIMIT)" section before setting it.

    # No `ports:` — not published to the host. Reachable only on the internal
    # docker network, by the static IPv4 the rspamd plugin uses.
    networks:
      internal_net:
        ipv4_address: 172.30.0.43

    environment:
      TZ: Europe/Amsterdam
      # Daily verified rule updates; 0 disables.
      MAILSTRIX_RULES_POLL_INTERVAL: "86400"
      MAILSTRIX_VERBOSE: "0"               # 1 for per-request access lines

      # --- Cache (built for high volume; mail is heavily duplicated) --------
      MAILSTRIX_CACHE_TTL: "3600"          # seconds; 0 disables
      # MAILSTRIX_CACHE_SIZE: "65536"      # in-memory LRU entries
      # Shared cache across replicas (else in-process LRU only):
      # MAILSTRIX_REDIS_URL: "redis://valkey:6379/6"
      # MAILSTRIX_REDIS_PREFIX: "yara:scan:"

      # --- Limits -----------------------------------------------------------
      # MAILSTRIX_MAX_CONCURRENT: "auto"   # in-flight scan cap; "auto"=CPU count, or a number
      # MAILSTRIX_BACKEND_TIMEOUT: "1"     # queue/admission wait budget (s)
      # MAILSTRIX_SCAN_TIMEOUT: "8"        # per-scan libyara budget (s)

      # --- Scoring policy ---------------------------------------------------
      # Canary/shadow mode: integrations observe hits but do not score/block.
      # MAILSTRIX_CANARY: "0"

      # --- Threat-intel feeds (abuse.ch, opt-in) ----------------------------
      # One free abuse.ch Auth-Key (https://auth.abuse.ch/) enables BOTH feeds.
      # Register at https://auth.abuse.ch/ — the same key works for URLhaus AND
      # MalwareBazaar. Prefer the _FILE form (Docker secret, never an env value).
      # URLhaus — known malware-distribution URLs in the message/macros:
      MAILSTRIX_URLHAUS_KEY_FILE: /run/secrets/abuse_ch_key
      # MalwareBazaar — exact SHA256 of each attachment vs known malware samples.
      # Full dump (~1M hashes) refreshed daily; see the mem_limit note above.
      # Commented out: the feed is enabled by MAILSTRIX_MBAZAAR_KEY[_FILE]. At
      # mem_limit 512m the measured 2026-10-15 refresh peak (~1.9 GiB VmHWM, one
      # sample) exceeds the limit. P32 (refresh spike fix) is expected to lower
      # it; re-measure and raise mem_limit only with a dated figure.
      # MAILSTRIX_MBAZAAR_KEY_FILE: /run/secrets/abuse_ch_key
      # MAILSTRIX_MBAZAAR_REFRESH: "86400" # seconds; floor 300
      # MAILSTRIX_MBAZAAR_FEED: "..."      # override feed URL (default: full dump)
      # ThreatFox — recent IOC URL/domain feed (botnet C&C indicators). Same key.
      MAILSTRIX_THREATFOX_KEY_FILE: /run/secrets/abuse_ch_key
      # MAILSTRIX_THREATFOX_REFRESH: "21600"  # 6h; floor 300

      # One "strixd status:" line on stdout per interval (health summary).
      # MAILSTRIX_STATUS_LOG: "1"           # off by default
      # MAILSTRIX_STATUS_INTERVAL: "900"    # seconds; floor 60

      # --- Auth (enabled for this reference deployment) --------------------
      # Core auth is optional, but this Compose file deliberately enables it
      # with a file-backed secret. Without the matching token /scan returns 401;
      # if the source file is missing, Compose cannot create the service.
      MAILSTRIX_TOKEN_FILE: /run/secrets/mailstrix_token

    secrets:
      - mailstrix_token
      - abuse_ch_key

    # Baked rules seed the writable cache. This tmpfs loses updates on recreation;
    # startup polling fetches the current bundle again. Use a persistent writable
    # volume at /var/cache/mailstrix to retain updates across recreation.

    # --- Hardening ---------------------------------------------------------
    read_only: true                    # immutable rootfs (distroless, nonroot)
    tmpfs:
      - /tmp:mode=1777
      - /var/cache/mailstrix:uid=65532,gid=65532,mode=0755
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "/usr/local/bin/strixd", "health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  internal_net:
    external: true
    name: mailscreen_internal_net

secrets:
  mailstrix_token:
    # Generate once without printing it: install -d -m 700 secrets &&
    # (umask 077; openssl rand -hex 32 > secrets/mailstrix_token.txt) &&
    # chmod 0444 secrets/mailstrix_token.txt
    # The container runs as uid 65532; owner-only host files are unreadable.
    file: ./secrets/mailstrix_token.txt
  abuse_ch_key:
    file: ./secrets/abuse_ch_key.txt   # one line: abuse.ch Auth-Key (URLhaus + MalwareBazaar)
